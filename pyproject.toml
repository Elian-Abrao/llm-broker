[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-broker"
version = "1.0.0"
description = "Local Python broker for LLM authentication and chat access (Codex, Gemini, etc.)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Elian Abrao" }
]
keywords = ["codex", "bridge", "broker", "oauth", "pkce", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
secure = ["keyring>=25,<26"]
publish = ["build>=1.2,<2", "twine>=5,<6"]

[project.scripts]
llm-broker = "llm_broker.interfaces.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
